name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_SHEETS_SIGNUP_URL: ${{ secrets.VITE_SHEETS_SIGNUP_URL }}
          VITE_SHEETS_DIRECTORY_CSV_URL: ${{ secrets.VITE_SHEETS_DIRECTORY_CSV_URL }}
          VITE_SHEETS_TRUCKS_API_URL: ${{ secrets.VITE_SHEETS_TRUCKS_API_URL || 'https://script.google.com/macros/s/AKfycbxQnQz5RF6lRgBSHG_51dKN4w1fDHCUkfaP7cAXMCq3T8-sHSk_kkwm5cZo9HxjFPs6Lg/exec' }}
          VITE_SHEETS_TRUCKS_CSV_URL: ${{ secrets.VITE_SHEETS_TRUCKS_CSV_URL || 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSmlu_k-OOjYD74jUuhnee008ocOrThC8_Co2V_yC8DT4D0XdaspqM2uTzElY-8cZOZRuWObrBUAH5-/pub?gid=985649226&single=true&output=csv' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
